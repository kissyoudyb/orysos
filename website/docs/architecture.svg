  <text x="620" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">OryxOS 架构总览</text>
  <text x="620" y="68" text-anchor="middle" font-size="13" fill="#64748B">Spring Boot 3.x 单体 · 一个引擎（ReAct）调度三大能力 · CLI 与 REST 双入口 · 实例无状态</text>

