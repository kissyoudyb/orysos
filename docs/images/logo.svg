<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OryxOS logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A30"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <ellipse cx="256" cy="292" rx="208" ry="196" fill="url(#glow)"/>

  <!-- 耳朵 -->
  <path d="M174 240 L108 212 L162 284 Z" fill="#D97706"/>
  <path d="M338 240 L404 212 L350 284 Z" fill="#D97706"/>

  <!-- 双角：长直如剑，微微外展 -->
  <path d="M199 222 L143 66 L159 57 L221 210 Z" fill="url(#horn)"/>
  <path d="M313 222 L369 66 L353 57 L291 210 Z" fill="url(#horn)"/>

  <!-- 羚首：低多边形盾形，居中对称 -->
  <path d="M256 176 L322 204 L358 262 L338 330 L290 398 L256 440 L222 398 L174 330 L154 262 L190 204 Z" fill="url(#face)"/>

  <!-- 面部标记：额菱、目纹、鼻端 -->
  <path d="M256 192 L293 233 L256 274 L219 233 Z" fill="#0B1220" opacity="0.92"/>
  <path d="M206 266 L234 277 L209 290 Z" fill="#0B1220" opacity="0.92"/>
  <path d="M306 266 L278 277 L303 290 Z" fill="#0B1220" opacity="0.92"/>
  <path d="M256 440 L234 396 L256 378 L278 396 Z" fill="#0B1220" opacity="0.92"/>
</svg>
